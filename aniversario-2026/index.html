<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aniversário · 08/08/2026</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="page-index">

  <!-- ── Partículas decorativas ─────────────────────────────────── -->
  <div class="particulas" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- ── Hero principal ────────────────────────────────────────── -->
  <main class="hero-index">
    <div class="hero-card">

      <!-- Ornamento topo -->
      <div class="ornamento-topo" aria-hidden="true">
        <span class="linha-ornamento"></span>
        <span class="diamante">◆</span>
        <span class="linha-ornamento"></span>
      </div>

      <!-- Eyebrow -->
      <p class="eyebrow">— Você está convidado —</p>

      <!-- Título principal -->
      <h1 class="titulo-convite">Venha comemorar<br/>meu aniversário</h1>

      <!-- Ornamento meio -->
      <div class="ornamento-meio" aria-hidden="true">✦</div>

      <!-- Data em destaque -->
      <div class="data-destaque">
        <span class="data-label">Save the date</span>
        <div class="data-numero-wrap">
          <span class="data-numero">08</span>
          <div class="data-separador">/</div>
          <span class="data-numero">08</span>
          <div class="data-mes-ano">
            <span>Agosto</span>
            <span class="data-ano">2026</span>
          </div>
        </div>
      </div>

      <!-- Infos -->
      <div class="infos-grade">
        <div class="info-pill">🕒 A partir das 14h</div>
      </div>

      <!-- Botão Maps -->
      <a href="https://www.google.com/maps/search/Artesano+Buffet+Boituva"
         target="_blank"
         class="btn-maps">
        📍 Clique aqui · Artesano Buffet · Boituva/SP
        <span class="seta-maps">↗</span>
      </a>

      <!-- Aviso kit churrasco -->
      <div class="aviso-churrasco">
        Kit Churrasco obrigatório 
                  🥩🍺
        <span class="aviso-detalhe">🥩🍺</span>
        <span class="aviso-detalhe">1kg de carne + sua bebida</span>
      </div>

      <!-- Ornamento divisor -->
      <div class="ornamento-divisor" aria-hidden="true">
        <span class="linha-ornamento"></span>
        <span class="flor">✾</span>
        <span class="linha-ornamento"></span>
      </div>

      <!-- CTA confirmação -->
      <a href="confirmacao.html" class="btn-cta">
        ✨ Confirmar Presença
      </a>

      <p class="rodape-card">Sua presença é o melhor presente!</p>

      <!-- Ornamento base -->
      <div class="ornamento-topo" style="margin-top:28px; margin-bottom:0;" aria-hidden="true">
        <span class="linha-ornamento"></span>
        <span class="diamante">◆</span>
        <span class="linha-ornamento"></span>
      </div>

    </div>
  </main>

</html>
